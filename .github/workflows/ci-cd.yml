name: CI/CD Pipeline
on:
  pull_request:
    branches:
      - production  # Trigger workflow on PR to production branch
  push:
    branches:
      - production  # Trigger workflow on push to production branch

env:
  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Build Frontend Docker Image
        working-directory: ./frontend
        run: |
          docker build -t donbasilpeter/frontend:latest .

      - name: Build Backend Docker Image
        working-directory: ./backend
        run: |
          docker build -t donbasilpeter/backend:latest .

  deploy-backend:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Zip Backend Deployment Package
        working-directory: ./backend
        run: zip -r backend-deploy.zip . -x '*.git*'

      - name: Deploy Backend to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: Template-Generator
          environment_name: Template-Generator-backend
          version_label: 1.4-backend
          region: us-west-2
          deployment_package: backend-deploy.zip

  deploy-frontend:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Zip Frontend Deployment Package
        working-directory: ./frontend
        run: zip -r frontend-deploy.zip . -x '*.git*'

      - name: Deploy Frontend to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: Template-Generator
          environment_name: Template-Generator-frontend
          version_label: 1.4-frontend
          region: us-west-2
          deployment_package: frontend-deploy.zip
