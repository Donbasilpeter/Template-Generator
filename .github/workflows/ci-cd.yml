name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - production  # Trigger the workflow on PR to production branch
  push:
    branches:
      - production  # Trigger the workflow when changes are pushed to the production branch
env:    
  REACT_APP_BASE_URL: ${{ secrets.REACT_APP_BASE_URL }}
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}


jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Images with Latest Tag
      run: |
        docker compose build
        docker compose push

  deploy-to-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2  

    - name: Update ECS Service for Frontend
      run: |
        aws ecs update-service --cluster your-cluster-name \
          --service frontend-service \
          --force-new-deployment \
          --desired-count 1

    - name: Update ECS Service for Backend
      run: |
        aws ecs update-service --cluster your-cluster-name \
          --service backend-service \
          --force-new-deployment \
          --desired-count 1
