name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - production  # Trigger the workflow on PR to production branch
  push:
    branches:
      - production  # Trigger the workflow when changes are pushed to the production branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Install Docker Compose
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/$(curl -s https://api.github.com/repos/docker/compose/releases/latest | jq -r .tag_name)/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      # Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Build frontend and backend Docker images
      - name: Build frontend Docker image
        run: docker-compose -f docker-compose.yml build frontend

      - name: Build backend Docker image
        run: docker-compose -f docker-compose.yml build backend

      # Push Docker images to a registry (if using Docker Hub, GitHub Container Registry, etc.)
      - name: Push Docker images
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker-compose -f docker-compose.yml push frontend
          docker-compose -f docker-compose.yml push backend

deploy:
    runs-on: ubuntu-latest
    needs: build  # This job depends on the build job

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up AWS CLI
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Deploy Docker images to Elastic Beanstalk environment
      - name: Deploy to Elastic Beanstalk
        run: |
          # Use the existing Elastic Beanstalk environment
          eb use my-environment  # Replace with your actual environment name
          eb deploy

      # Optionally, check the status after deployment
      - name: Check deployment status
        run: eb status

