services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # environment:
    #   - REACT_APP_BASE_URL=${REACT_APP_BASE_URL}
    stdin_open: false  # Disable stdin in production
    tty: false  # Disable tty in production
    networks:
      - app-network

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    environment:
      # - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - CORS_ORIGIN=${CORS_ORIGIN}
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"  # Expose port 80 for Nginx (frontend and backend will be routed through Nginx)
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
