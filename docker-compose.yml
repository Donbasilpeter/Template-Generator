services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: donbasilpeter/frontend:latest
    stdin_open: false  # Disable stdin in production
    tty: false  # Disable tty in production
    networks:
      - app-network

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: donbasilpeter/backend:latest
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"  # Expose port 80 for Nginx (frontend and backend will be routed through Nginx)
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
