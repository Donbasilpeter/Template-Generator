services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: donbasilpeter/frontend:latest
    ports:
      - "80:80"  # Use port 80 for production
    depends_on:
      - backend  # Ensures backend is started before frontend
    stdin_open: false  # Disable stdin in production
    tty: false  # Disable tty in production
    networks:
      - app-network
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: donbasilpeter/backend:latest
    ports:
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
