services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"  # Use port 80 for production
    environment:
      - REACT_APP_BASE_URL=${REACT_APP_BASE_URL}
    depends_on:
      - backend  # Ensures backend is started before frontend
    stdin_open: false  # Disable stdin in production
    tty: false  # Disable tty in production
    networks:
      - app-network

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
